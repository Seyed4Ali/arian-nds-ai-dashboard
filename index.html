<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arian NDS AI</title>
<style>body{font-family:system-ui;background:#0b0d10;color:#f5f5f5;margin:0;padding:16px} .card{background:#15191f;border:1px solid #252b33;border-radius:16px;padding:16px;margin:10px 0}.price{font-size:38px;font-weight:700}.muted{color:#9aa4b2}.row{display:flex;justify-content:space-between;margin:8px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1d3a29;color:#7ee2a8}</style></head>
<body><h2>Arian NDS AI</h2><div class="card"><div class="muted">FXPRO PUBLIC LIVE QUOTE</div><div id="price" class="price">—</div><div class="row"><span>Bid</span><b id="bid">—</b></div><div class="row"><span>Ask</span><b id="ask">—</b></div><div class="row"><span>Spread</span><b id="spread">—</b></div><div class="pill">SHADOW MODE</div></div><div class="card"><div class="muted">Feed status</div><div id="status">Waiting…</div><div class="muted" id="ts"></div></div>
<script>async function tick(){try{let r=await fetch('/api/live/quote');let d=await r.json();if(!d.ok)throw Error(d.error||'feed error');document.querySelector('#price').textContent=d.bid.toFixed(2);document.querySelector('#bid').textContent=d.bid.toFixed(2);document.querySelector('#ask').textContent=d.ask.toFixed(2);document.querySelector('#spread').textContent=(d.ask-d.bid).toFixed(2);document.querySelector('#status').textContent='CONNECTED · '+d.source;document.querySelector('#ts').textContent=d.timestamp_utc;}catch(e){document.querySelector('#status').textContent='DISCONNECTED · '+e.message}} tick();setInterval(tick,5000)</script></body></html>
